[package]
name = "phonehome"
version = "0.1.0"
edition = "2021"
description = "See which apps on your machine phone home, and to whom."
license = "MIT"
repository = "https://github.com/mxbhr/phonehome"
keywords = ["network", "privacy", "monitoring", "netlink", "geoip"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
flate2 = "1"
maxminddb = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
ureq = { version = "2", features = ["json", "native-certs"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
netstat2 = "0.11"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
